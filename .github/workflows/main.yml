name: Auto Send Telegram

on:
  schedule:
    # รันตอน 06:00 น. เวลาไทย เฉพาะจันทร์-ศุกร์ 
    # (ตรงกับ 23:00 UTC ของวันอาทิตย์-พฤหัสบดี)
    - cron: '0 23 * * 0-4'
    
    # รันตอน 18:00 น. เวลาไทย เฉพาะจันทร์-ศุกร์ 
    # (ตรงกับ 11:00 UTC ของวันจันทร์-ศุกร์)
    - cron: '0 11 * * 1-5'
    
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py
